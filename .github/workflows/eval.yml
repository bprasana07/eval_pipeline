name: Agent evaluation

# Three tiers, because judge calls cost money and 1,000 cases x 3 runs
# x 6 evaluators is roughly 18,000 model calls per push.
#
#   push          rules only, 1 run      free, ~10s     runs always
#   pull_request  rules + judge, 3 runs  pennies        gates the merge
#   manual        rules + judge, 5 runs  pre-release    on demand
#
# config.py reads .env, but real environment variables win over the file,
# so CI injects secrets without a .env existing at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: "Executions per case"
        default: "5"

jobs:
  smoke:
    name: Rule evaluators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install: the rules path has zero dependencies by design.
      - name: Run deterministic rules
        shell: bash
        env:
          USE_REAL_AGENT: "0"     # scripted agent - no model calls, no key
        run: |
          set +e
          python -B run_eval.py --runs 1 --no-judge --quiet | tee result.txt
          code=${PIPESTATUS[0]}
          {
            echo "### Rule evaluators (scripted agent)"
            echo '```'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  full:
    name: Rules + LLM judge
    # Only on PRs and manual runs. This tier costs money.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned, so CI runs the same SDK as the laptop. An unpinned dependency
      # is the most common cause of "works on my machine" in Python.
      - name: Install
        run: pip install --quiet -r requirements.txt

      # Prints the config and the URL the SDK actually builds, then makes two
      # raw POSTs that bypass the SDK entirely. This runs BEFORE the pipeline,
      # so a failure is diagnosed rather than guessed at.
      - name: Diagnose Azure config
        shell: bash
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error, openai
          from openai import AzureOpenAI

          def show(name):
              v = os.environ.get(name)
              if v is None:
                  print(f"{name:<28} NOT SET"); return ""
              if not v.strip():
                  print(f"{name:<28} EMPTY"); return ""
              print(f"{name:<28} len={len(v):<4} stripped={len(v.strip()):<4} "
                    f"first={v.strip()[:6]!r} last={v.strip()[-4:]!r}")
              return v.strip()

          ep  = show("AZURE_OPENAI_ENDPOINT")
          key = show("AZURE_OPENAI_API_KEY")
          dep = show("AZURE_OPENAI_DEPLOYMENT")
          ver = show("AZURE_OPENAI_API_VERSION")
          print(f"{'openai SDK':<28} {openai.__version__}")

          if not all([ep, key, dep, ver]):
              raise SystemExit("\n  A required value is missing - fix the secret above.\n")

          client = AzureOpenAI(azure_endpoint=ep, api_key=key, api_version=ver)
          print(f"{'base_url':<28} {client.base_url}")
          print()

          # Bypass the SDK. If one of these returns 200, the endpoint is
          # reachable from this network and the problem is request shape.
          body = json.dumps({"messages": [{"role": "user", "content": "hi"}],
                             "max_completion_tokens": 8}).encode()
          candidates = [
              f"{str(client.base_url).rstrip('/')}/deployments/{dep}/chat/completions?api-version={ver}",
              f"{ep.rstrip('/')}/chat/completions?api-version={ver}",
              f"{ep.rstrip('/')}/deployments/{dep}/chat/completions?api-version={ver}",
          ]
          for url in candidates:
              req = urllib.request.Request(
                  url, data=body, method="POST",
                  headers={"api-key": key, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30):
                      print(f"  200 OK   {url}")
              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", "replace")[:120].replace("\n", " ")
                  print(f"  {e.code}      {url}")
                  if e.code not in (404,):
                      print(f"           {detail}")
              except Exception as e:
                  print(f"  ERR      {type(e).__name__}: {e}")
          PY

      - name: Run full evaluation
        shell: bash
        env:
          USE_REAL_AGENT: "1"
          USE_JUDGE: "1"
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          RUNS: ${{ github.event.inputs.runs || '3' }}
        run: |
          set +e
          python -B run_eval.py --runs "$RUNS" --judge | tee result.txt
          code=${PIPESTATUS[0]}
          {
            echo "### Full evaluation - $RUNS runs per case"
            echo '```'
            cat result.txt
            echo '```'
            if [ "$code" -ne 0 ]; then
              echo "**Gate failed.** Fix the breach above, or say why the threshold"
              echo "should change - do not lower it to go green."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # Keep the output even when the gate fails, so a reviewer can read the
      # failing run without re-triggering anything.
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-result
          path: result.txt
          retention-days: 14